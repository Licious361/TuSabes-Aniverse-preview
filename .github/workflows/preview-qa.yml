name: AniVerse preview safety and functional QA
on:
  push:
    branches: ['launch/affiliate-preview-gated-20261021']
  pull_request:
    paths:
      - 'index.html'
      - 'experience.html'
      - 'script.js'
      - 'style.css'
      - 'config.js'
      - 'privacy.html'
      - 'catalog.json'
      - 'functions/**'
      - 'tests/**'
      - '.github/workflows/preview-qa.yml'
      - '_routes.json'
      - 'package.json'
      - 'scripts/**'
      - 'robots.txt'
      - '_headers'
      - 'LAUNCH_READINESS.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout changes
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: npm run check
      - name: Build public-only Cloudflare dist output
        run: npm run build
      - name: Deterministic anti-drift, client and backend tests
        run: npm test
